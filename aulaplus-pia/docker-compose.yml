services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aulaplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aulaplus}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: { context: ., target: app }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aulaplus}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-aulaplus}
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"

  db_test:
    image: postgres:16-alpine
    profiles: ["tests"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aulaplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: aulaplus_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build: { context: ., target: tests }
    profiles: ["tests"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aulaplus}:${POSTGRES_PASSWORD:-change_me}@db_test:5432/aulaplus_test
    depends_on:
      db_test: { condition: service_healthy }

volumes:
  dbdata:
