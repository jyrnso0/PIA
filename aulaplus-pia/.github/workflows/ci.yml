name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aulaplus, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: aulaplus }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aulaplus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://aulaplus:ci_password@localhost:5432/aulaplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build app
      - run: docker compose --profile tests run --rm tests
      - run: docker compose down -v
  deploy:
    # CD: Render redespliega solo al recibir el hook (secreto RENDER_DEPLOY_HOOK en GitHub).
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Configure the RENDER_DEPLOY_HOOK repository secret before deploying."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
